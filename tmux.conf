# ============================================================
#  tmux — visual Catppuccin Mocha (sem plugins) + atalhos fáceis
#  Repositório: github.com/dionatansimioni/tmux-config
# ============================================================

# ---------- Cores / terminal ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB"

# ---------- Comportamento geral ----------
set -g mouse on                 # clicar em painéis/abas, rolar, redimensionar com o mouse
set -g base-index 1             # janelas começam em 1 (mais perto da mão no teclado)
setw -g pane-base-index 1
set -g renumber-windows on      # renumera ao fechar janelas
set -g history-limit 50000
set -sg escape-time 10          # sem atraso no ESC (bom para vim/nvim)
set -g focus-events on
setw -g mode-keys vi            # modo cópia com teclas do vi
set -g display-time 2000

# ---------- Atalhos mais intuitivos ----------
# Recarregar config: Prefixo + r
bind r source-file ~/.tmux.conf \; display "Configuração recarregada!"

# Dividir painéis: Prefixo + |  (lado a lado)   Prefixo + -  (em cima/embaixo)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navegar entre painéis SEM prefixo: Alt + setas
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Trocar de janela SEM prefixo: Shift + setas  /  Alt + 1..9
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Listar sessões disponíveis (e janelas) para trocar: Alt + s  (ou Prefixo + s)
bind -n M-s choose-tree -Zs
bind s choose-tree -Zs
# Nova sessão com nome: Prefixo + N
bind N command-prompt -p "Nome da nova sessão:" "new-session -s '%%'"

# Redimensionar painéis: Prefixo + H/J/K/L (pode repetir sem soltar)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Modo cópia estilo vim: v seleciona, y copia
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------- Menu de atalhos: Prefixo + m ----------
bind m display-menu -T "#[align=centre fg=#cba6f7 bold] Atalhos " -x C -y C \
  "Novo painel lado a lado"  "|" "split-window -h -c '#{pane_current_path}'" \
  "Novo painel embaixo"      "-" "split-window -v -c '#{pane_current_path}'" \
  "Nova janela"              "c" "new-window -c '#{pane_current_path}'" \
  "Renomear janela"          "," "command-prompt -I '#W' 'rename-window -- \"%%\"'" \
  "" \
  "Zoom no painel (liga/desliga)" "z" "resize-pane -Z" \
  "Trocar layout"            "Space" "next-layout" \
  "Listar sessões (Alt+s)"   "s" "choose-tree -Zs" \
  "Nova sessão"              "N" "command-prompt -p 'Nome da nova sessão:' \"new-session -s '%%'\"" \
  "Modo cópia / rolar"       "[" "copy-mode" \
  "" \
  "Fechar painel"            "x" "confirm-before -p 'Fechar painel? (y/n)' kill-pane" \
  "Fechar janela"            "&" "confirm-before -p 'Fechar janela? (y/n)' kill-window" \
  "Desanexar (detach)"       "d" "detach-client" \
  "" \
  "Recarregar config"        "r" "source-file ~/.tmux.conf"

# ---------- Tema Catppuccin Mocha (manual) ----------
# base #1e1e2e  surface0 #313244  surface1 #45475a  text #cdd6f4  subtext #a6adc8
# mauve #cba6f7  blue #89b4fa  green #a6e3a1  peach #fab387  red #f38ba8  yellow #f9e2af

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Esquerda: nome da sessão (fica laranja quando o prefixo está pressionado)
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=#fab387],#[bg=#cba6f7]}#[fg=#1e1e2e,bold]  #S #[bg=#1e1e2e,fg=#cdd6f4,nobold] "

# Direita: dicas de atalho + data/hora
set -g status-right-length 120
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#fab387 bold]PREFIXO ATIVO  ,}m menu · Alt+s sessões · | - dividir · Alt+setas painéis · Shift+setas janelas #[fg=#1e1e2e,bg=#89b4fa,bold]  %H:%M #[bg=#313244,fg=#cdd6f4,nobold] %d/%m "

# Abas de janelas
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#a6adc8,bg=#313244] #I #[fg=#cdd6f4,bg=#45475a] #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I #[fg=#cdd6f4,bg=#45475a,bold] #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-activity-style "fg=#f9e2af"
setw -g monitor-activity on
set -g visual-activity off

# Bordas dos painéis (ativa destacada) + título no topo de cada painel
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#cba6f7 bold],#[fg=#6c7086]}#P: #{pane_current_command} #[fg=#6c7086]#{b:pane_current_path} "

# Mensagens, menus, modo cópia, popups
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g menu-style "bg=#1e1e2e,fg=#cdd6f4"
set -g menu-selected-style "bg=#cba6f7,fg=#1e1e2e,bold"
set -g menu-border-style "fg=#cba6f7"
set -g menu-border-lines rounded
set -g popup-border-style "fg=#cba6f7"
set -g popup-border-lines rounded
setw -g clock-mode-colour "#cba6f7"
